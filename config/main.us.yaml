name: Star Ocean 3 US main executable C scaffold
sha1: 1f8b172c0c2ff3f0b80bb6763077fdf33e271dcf
options:
  basename: main
  target_path: disc/us-disc1/iso/SLUS_204.88
  base_path: ..
  platform: ps2
  compiler: MWCCPS2
  asm_path: build/main/asm
  asset_path: build/main/bin
  src_path: src
  build_path: build/main
  ld_script_path: build/main/main.ld
  generated_asm_macros_directory: build/main/include
  cache_path: build/main/splat.cache
  symbol_addrs_path: [config/symbols/main_symbol_addrs.txt]
  reloc_addrs_path: [config/relocations/main_reloc_addrs.txt]
  undefined_funcs_auto_path: build/main/undefined_funcs.ld
  undefined_syms_auto_path: build/main/undefined_syms.ld
  create_c_files: true
  make_full_disasm_for_code: true
  auto_decompile_empty_functions: false
  generated_c_preamble: '#include "include_asm.h"'
  asm_inc_header: |
    .set noat
    .set noreorder
  migrate_rodata_to_functions: false
  subalign: null
  find_file_boundaries: false
  disasm_unknown: true
  gp_value: 0x001BDFF0
  # Resident memory, including BSS, from the first ELF load segment.
  global_vram_start: 0x00100000
  global_vram_end: 0x001DD380
  # MWLDPS2 rejects the sized <function>.NON_MATCHING symbol splat's nonmatching
  # macro adds to every assembly function, so this module redefines it as empty.
  # The nonmatching lines stay in the .s files for the tools that read them.
  generated_macro_inc_content: |
    .purgem nonmatching
    .macro nonmatching label, size=1
    .endm
    .set Q, $Q
    .set ACC, $ACC
    .set I, $I
    .set R, $R
