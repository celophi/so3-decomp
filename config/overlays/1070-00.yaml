  symbol_addrs_path: [config/symbols/1070-00_symbol_addrs.txt, config/symbols/1070-00_data_addrs.txt]
  reloc_addrs_path: [config/relocations/1070-00_reloc_addrs.txt]
  undefined_funcs_auto_path: build/overlays/1070-00/undefined_funcs.ld
  undefined_syms_auto_path: build/overlays/1070-00/undefined_syms.ld
  create_c_files: true
  make_full_disasm_for_code: true
  auto_decompile_empty_functions: false
  generated_c_preamble: '#include "include_asm.h"'
  asm_inc_header: |
    .set noat
    .set noreorder
  migrate_rodata_to_functions: false
  subalign: null
  find_file_boundaries: false
  disasm_unknown: true
  gp_value: 0x1bdff0
  # MWLDPS2 rejects the sized <function>.NON_MATCHING symbol splat's nonmatching
  # macro adds to every assembly function, so this module redefines it as empty.
  # The nonmatching lines stay in the .s files for the tools that read them.
  generated_macro_inc_content: |
    .purgem nonmatching
    .macro nonmatching label, size=1
    .endm
    .set Q, $Q
    .set ACC, $ACC
    .set I, $I
    .set R, $R
