name: Star Ocean 3 US overlay cskill (0069-00, cskill.bin)
sha1: fc3c01fc2e7917917e1002086cdd036e5213dd6c
sha256: 38c19c5dda5adace88ba8a6653ca3b5fd8f482948d21e9e051f3ac073f788f0f
options:
  basename: cskill
  target_path: disc/us-disc1/modules/0069-00.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2
  asm_path: build/overlays/cskill/asm
  asset_path: build/overlays/cskill/bin
  src_path: src/overlays/cskill
  build_path: build/overlays/cskill
  ld_script_path: build/overlays/cskill/overlay.ld
  generated_asm_macros_directory: build/overlays/cskill/include
  cache_path: build/overlays/cskill/splat.cache
  symbol_addrs_path: [config/symbols/cskill_symbol_addrs.txt]
  reloc_addrs_path: [config/relocations/cskill_reloc_addrs.txt]
  undefined_funcs_auto_path: build/overlays/cskill/undefined_funcs.ld
  undefined_syms_auto_path: build/overlays/cskill/undefined_syms.ld
  create_c_files: true
  make_full_disasm_for_code: true
  auto_decompile_empty_functions: false
  generated_c_preamble: '#include "include_asm.h"'
  asm_inc_header: |
    .set noat
    .set noreorder
  migrate_rodata_to_functions: false
  subalign: 4
  find_file_boundaries: false
  disasm_unknown: true
  gp_value: 0x1bdff0
  global_vram_start: 0x1B6000
  global_vram_end: 0x1B7000
  # MWLDPS2 rejects the sized <function>.NON_MATCHING symbol splat's nonmatching
  # macro adds to every assembly function, so this module redefines it as empty.
  # The nonmatching lines stay in the .s files for the tools that read them.
  generated_macro_inc_content: |
    .purgem nonmatching
    .macro nonmatching label, size=1
    .endm
    .set Q, $Q
    .set ACC, $ACC
    .set I, $I
    .set R, $R
segments:
  - name: header
    type: bin
    start: 0x0
    vram: 0x348380
  - name: text
    type: code
    start: 0x40
    vram: 0x3483c0
    subalign: 16
    subsegments:
      - [0x40, pad, text_start]
      - [0x80, cpp, text]
  - [0x1ca00, bin, data]
  - [0x1cb80]
