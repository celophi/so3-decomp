name: Star Ocean 3 US overlay ctactics (0073-00, ctactics.bin)
sha1: f44a0380b5eb8f350869665d73de5248580cf54c
sha256: d636d5babecec00b79024b86f7e5354e6885f3938f8a4ab4a5a820f8725e8925
options:
  basename: ctactics
  target_path: disc/us-disc1/modules/0073-00.bin
  base_path: ../..
  platform: ps2
  compiler: MWCCPS2
  asm_path: build/overlays/ctactics/asm
  asset_path: build/overlays/ctactics/bin
  src_path: src/overlays/ctactics
  build_path: build/overlays/ctactics
  ld_script_path: build/overlays/ctactics/overlay.ld
  generated_asm_macros_directory: build/overlays/ctactics/include
  cache_path: build/overlays/ctactics/splat.cache
  undefined_funcs_auto_path: build/overlays/ctactics/undefined_funcs.ld
  undefined_syms_auto_path: build/overlays/ctactics/undefined_syms.ld
  create_c_files: true
  make_full_disasm_for_code: true
  auto_decompile_empty_functions: false
  generated_c_preamble: '#include "include_asm.h"'
  asm_inc_header: |
    .set noat
    .set noreorder
  migrate_rodata_to_functions: false
  subalign: null
  find_file_boundaries: false
  disasm_unknown: true
  gp_value: 0x1bdff0
  symbol_addrs_path:
    - config/symbols/ctactics_symbol_addrs.txt
  global_vram_start: 0x100000
  global_vram_end: 0x507A00
  # MWLDPS2 rejects the sized <function>.NON_MATCHING symbol splat's nonmatching
  # macro adds to every assembly function, so this module redefines it as empty.
  # The nonmatching lines stay in the .s files for the tools that read them.
  generated_macro_inc_content: |
    .purgem nonmatching
    .macro nonmatching label, size=1
    .endm
    .set Q, $Q
    .set ACC, $ACC
    .set I, $I
    .set R, $R
segments:
  - name: header
    type: bin
    start: 0x0
    vram: 0x348380
  - name: text
    type: code
    start: 0x40
    vram: 0x3483c0
    subsegments:
      - [0x40, pad, text_start]
      - [0x80, cpp, text]
      - [0x9C80, databin, data]
      - [0x9D70, .rodata, text]
      - [0x9D90, rodatabin, rodata_00352110]
  - [0x9e00]
