name: Star Ocean 3 US overlay boot (0002-00, boot.bin)
sha1: f022ccbfc02e94b5c81c159179c508c4fe2f0354
sha256: 1f7412ea6e524209eea14cb5b78006262726af12d7e7b2a1f4d8bb847d24c0de
options:
  basename: boot
  target_path: disc/us-disc1/modules/0002-00.bin
  base_path: ../..
  symbol_addrs_path: [config/symbols/boot_symbol_addrs.txt]
  platform: ps2
  compiler: MWCCPS2
  asm_path: build/overlays/boot/asm
  asset_path: build/overlays/boot/bin
  src_path: src/overlays/boot
  build_path: build/overlays/boot
  ld_script_path: build/overlays/boot/overlay.ld
  generated_asm_macros_directory: build/overlays/boot/include
  cache_path: build/overlays/boot/splat.cache
  undefined_funcs_auto_path: build/overlays/boot/undefined_funcs.ld
  undefined_syms_auto_path: build/overlays/boot/undefined_syms.ld
  create_c_files: true
  make_full_disasm_for_code: true
  auto_decompile_empty_functions: false
  generated_c_preamble: '#include "include_asm.h"'
  asm_inc_header: |
    .set noat
    .set noreorder
  migrate_rodata_to_functions: false
  # No SUBALIGN (splat's default is 16). Every object already carries the
  # alignment it needs, and MWLDPS2 could only raise it.
  subalign: null
  find_file_boundaries: false
  disasm_unknown: true
  gp_value: 0x1bdff0
  global_vram_start: 0x1B65F0
  global_vram_end: 0x205E38
  # MWLDPS2 rejects the sized <function>.NON_MATCHING symbol splat's nonmatching
  # macro adds to every assembly function, so this module redefines it as empty.
  # The nonmatching lines stay in the .s files for the tools that read them.
  generated_macro_inc_content: |
    .purgem nonmatching
    .macro nonmatching label, size=1
    .endm
    .set Q, $Q
    .set ACC, $ACC
    .set I, $I
    .set R, $R
segments:
  - name: header
    type: bin
    start: 0x0
    vram: 0x1dd380
  - name: text
    type: code
    start: 0x40
    vram: 0x1dd3c0
    subsegments:
      - [0x40, c, text_001DD3C0]
      - [0x10160, c, text_001ED4E0]
      - [0x21D20, c, text_001FF0A0]
      # Linker padding: the data section starts on a 128-byte boundary.
      - [0x27D60, pad, text_end_align]
  - [0x27d80, bin, data]
  - name: init
    type: code
    start: 0x28980
    vram: 0x205d00
    subsegments:
      - [0x28980, c, init]
  - [0x28a40, bin, init_table]
  - [0x28a80]
